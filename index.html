<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieFlix</title>
    <link rel="stylesheet" href="style.css">
    <link rel="apple-touch-icon" sizes="180x180" href="../icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../icons/favicon-16x16.png">
    <link rel="manifest" href="../icons/site.webmanifest">
    
</head>
<body>
    <header id="headers"> <h1><a href="/">🎬 MovieFlix</a></h1>
        <nav>
            <div class="search-field-div">
                <button class="go-back" aria-label="Go back" onclick="history.back()">←</button>
                <label for="search" class="sr-only">Search for movies</label>
                <input type="text" name="search" id="search" placeholder="Search Movies..." aria-describedby="search-help">
                <span id="search-help" class="sr-only">Enter a movie title to search</span>
            </div>
            <div class="buttons"><button id='search-button' aria-label="Search for movies" disabled onclick="searchMovie()">Search</button> <button id="fav-button" onclick="openFavourites()">Favourites</button>
            </div>
        </nav>
    </header>
    <section class="spinner" id="spinner">
        <div class="loader"></div>
    </section>
    <script src="index.js"></script>
</body>
</html>
